<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Bootstrap 예시</title>
  <link rel="stylesheet" href="./portfolio.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="tablet-container">
    <div class="tablet-wrapper">
      <div class="tablet-content">
        <!-- 내비게이션 바는 공통 -->
        <header>
          <nav class="navbar navbar-dark bg-dark w-100 px-5 d-flex justify-content-between align-items-center"
            style="z-index: 99;">
            <a class="navbar-brand text-primary" href="#main-part">Portfolio</a>

            <!-- 중앙: 사람 선택 -->
            <!-- 중앙 Carousel 부분 -->
            <div id="personCarousel" class="carousel slide w-50">
              <div class="carousel-inner text-center">
                <div class="carousel-item active" data-person="yoonpyo">
                  <h6 class="text-white">윤표</h6>
                </div>
                <div class="carousel-item" data-person="kyungeun">
                  <h6 class="text-white">경은</h6>
                </div>
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#personCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" style="width:16px; height:16px;"></span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#personCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" style="width:16px; height:16px;"></span>
              </button>
            </div>


            <!-- 오른쪽: nav 링크 -->

            <ul class="nav">
              <li><a class="nav-link text-white" href="#main-part">Main</a></li>
              <li><a class="nav-link text-white" href="#about-part">About</a></li>
              <li><a class="nav-link text-white" href="#language-part">Skill</a></li>
              <li><a class="nav-link text-white" href="#stack-part">Stack</a></li>
              <li><a class="nav-link text-white" href="#to-be-part">Closing</a></li>
            </ul>


          </nav>
        </header>


        <main id="person-content">
          <!-- 불러온 사람 콘텐츠가 이 안에 들어옴 -->
        </main>

      </div>

      <div class="table-footer">
        <div class="footer-item main-icon">
          <img class="go-to-main-icon" src="https://ssafy-embedded-pjt.mincodinglab.com/14/pjt2/images/car.svg">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="portfilio.js"></script>
</body>


</html>
